name: Server tests

on:
  push:
    paths: ["server/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-tests.yml"]
  # Called by deploy-api.yml so a deploy only follows green tests.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thebook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thebook_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thebook_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: npm run test:sql
